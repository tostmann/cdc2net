## Project manifest for the `main` component (PlatformIO maps src/ onto it).
##
## Everything else CDC2NET needs is vendored under components/ and picked up
## automatically.  CherryUSB is the exception: upstream is ~100 MB (all ports,
## classes and demos), which has no business in this repo — so it comes from
## the component registry instead.
##
## Only fetched for USB-OTG-capable targets; the C3/C6 stick missions
## (CDC2NET_SOURCE_UART) must not drag it in.  The dependency is still gated a
## second time in CMakeLists.txt on CONFIG_CDC2NET_SOURCE_USB_CHERRY — the rule
## below only decides whether the component is downloaded at all.
dependencies:
  cherry-embedded/cherryusb:
    version: "^1.6"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4, esp32s31]"
