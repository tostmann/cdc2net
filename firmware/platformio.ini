; CDC2NET firmware — ser2net-style USB-Host-CDC -> network bridge on
; ESP32-S3 (YD-ESP32-S3 V1.4 / 16 MB).  Generalisation of RFNETHM.
;
; Bringup board: YD-ESP32-S3.  Two USB ports:
;   - USB1 (CH343P)  = programming + UART0 console  -> flash/monitor here
;   - USB2 (native)  = USB-OTG PHY, reserved for HOST mode (the stick)
; Auto-reset/-bootload via DTR/RTS on USB1 is the same path as RFNETHM.

[platformio]
; Build output on local ext4, NOT on the NFS-mounted /Public.  NFS close()
; flushes only to the client cache; ranlib/esptool reading an archive or
; image before write-back has bitten RFNETHM ("file format not recognized",
; NUL-prefixed version.h).  Keep artifacts off NFS.
build_dir = /root/pio-build/cdc2net-build
; App sources live in main/ (plain-IDF layout) so the SAME tree builds under
; plain `idf.py` too — needed for the ESP32-S31 (preview target on IDF master,
; unknown to this platform pin; see the S31 note below).  PlatformIO maps
; src_dir onto the IDF `main` component regardless of the dir name.
src_dir = main

[env:cdc2net]
; espressif32@6.13.0 == IDF 5.5.x.  Pinned because several platform versions
; are cached locally and the default differs between machines.  This is also
; the IDF on which RFNETHM runs USB-host + WiFi together (the #15079
; coexistence counter-evidence) — keep aligned until M1 re-validates
; enumeration-under-WiFi for true CDC-ACM / ESP-JTAG devices.
platform   = espressif32@6.13.0
board      = esp32-s3-devkitc-1
framework  = espidf

monitor_speed = 115200

; --- Flash/upload port (USB1 / CH343P) --------------------------------
; Fill in THIS board's stable by-id path before flashing, e.g.:
;   upload_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXX-if00
;   monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXX-if00
; Left unset on purpose so a wrong device path isn't baked in.
upload_speed = 921600

board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_build.partitions  = partitions_ota.csv

; Pre-build hook: snapshot working tree to git (repo root = /Public/CLAUDE/
; CDC2NET), bump build_number.txt, regenerate main/version.h.
extra_scripts = pre:scripts/version_bump.py

; YD-ESP32-S3 V1.4 has no active VBUS switch -> passive 5V tie, VBUS_GPIO=-1
; (consumed from M1 on in the USB-host source).  Boards with a TPS2065/
; SY6280-style switch set the GPIO + active polarity here.
;build_flags =
;    -D VBUS_GPIO=12
;    -D VBUS_ACTIVE_HIGH=1

; ======================================================================
; cherry — S3 build of the product firmware on the CherryUSB host stack
; (CONFIG_CDC2NET_SOURCE_USB_CHERRY in sdkconfig.cherry) instead of esp-usb.
; Additive: env:cdc2net keeps shipping the bench-proven esp-usb path untouched
; until this one is hardware-verified.  Motivation + measurements: esp-usb has
; no transaction-translator support, so FS sticks behind an HS hub are rejected
; — which blocks the S31 entirely (UTMI-only PHY = HS root port).  CherryUSB
; does splits and brings its own CDC-ACM/FTDI/CH34x/CP210x drivers.
; The S31 variant needs IDF master (esp32s31 is a preview target there and is
; unknown to espressif32@6.13.0/IDF 5.5.3), so it cannot be a PlatformIO env —
; it is built from the SAME tree with plain idf.py instead (app sources live in
; main/, plain-IDF layout):
;   idf.py --preview set-target esp32s31 && idf.py build
; The tracked sdkconfig.defaults.esp32s31 overlay (auto-appended by IDF) makes
; that zero-arg: it selects the CherryUSB source (esp-usb has no TT support and
; the S31 root port is HS-only), 16 MB flash and partitions_ota.csv.  Build on
; a host with an IDF-master checkout; flash offsets from build/flasher_args.json
; (bootloader @0x2000 on S31).  HW-verified end-to-end 2026-07-22.
[env:cherry]
extends = env:cdc2net
; Fresh-checkout reproducibility: sdkconfig.<env> files are generated (and
; gitignored), so the CherryUSB switches live in the tracked fragment
; sdkconfig.defaults.cherry, appended via SDKCONFIG_DEFAULTS.  IDF still
; auto-appends "<entry>.<target>" per list entry (kconfig.cmake), so the
; esp32s3 overlay is applied after sdkconfig.defaults as usual and the cherry
; fragment stays last — the fragment's source choice wins.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.cherry"

; ======================================================================
; hubprobe — THROWAWAY S3 build: enable external USB-hub support and probe the
; 8-channel budget with a hub + 2x CDC (CUL + C6-JTAG).  app_main runs
; hubprobe_run() ONLY (no WiFi/bridge/UI), gated on -D CDC2NET_HUBPROBE.  Its
; sdkconfig (sdkconfig.hubprobe) is a copy of sdkconfig.cdc2net with
; CONFIG_USB_HOST_HUBS_SUPPORTED=y.  Version-bump hook disabled so the throwaway
; does not snapshot/bump the product build counter.  Set upload/monitor_port to
; THIS S3's CH343 console before flashing.  NOT for release.
[env:hubprobe]
extends = env:cdc2net
build_flags = -D CDC2NET_HUBPROBE
extra_scripts =
; upload_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXX-if00
; monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXX-if00

; ======================================================================
; EUL/TUL serial-downlink stick — ESP32-C6 + W5500 ethernet (FPC add-on).
;   source = onboard EnOcean TCM515 radio over UART1 (byte-transparent)
;   net    = WiFi-STA/SoftAP + (next checkpoint) W5500 SPI ethernet
; Chip/mission config comes from sdkconfig.defaults.esp32c6 (IDF auto-appends
; the per-target overlay).  TCM515 UART + W5500 SPI pins default to the C6 EUL
; generation in source_uart.c / net_eth.c; override here with -D if a carrier
; board differs.  Flash = 4 MB: the busware EUL/TUL C6 module ships 4 MB (NOT
; the 8 MB the devkit JSON assumes — an 8 MB header panic-loops the flash probe).
; partitions_eul_4m.csv = 2x ~1.98 MB OTA + 64 KB coredump = exactly 4 MB.
; ======================================================================
[env:eul-c6]
extends = env:cdc2net
board    = esp32-c6-devkitc-1
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = partitions_eul_4m.csv
; Per-target OTA channel — install.busware.de/cdc2net/<env>/ (release.sh writes
; webflasher/<env>/, deploy.sh syncs the subtree).  cdc2net(S3) stays on the
; flat /cdc2net/ default (ota_check.h) so shipped v0.1.48 devices keep updating.
; The subdir MUST equal the env name (release.sh derives it from ENV).
build_flags =
    -D OTA_CHECK_MANIFEST_URL=\"https://install.busware.de/cdc2net/eul/manifest.json\"
    -D OTA_FIRMWARE_URL=\"https://install.busware.de/cdc2net/eul/firmware_esp32c6.bin\"

; EUL/TUL low-flash stick — ESP32-C3 (seeed XIAO), WiFi-only (no W5500/FPC).
;   source = onboard EnOcean TCM515 over UART1 @ the C3 pin map (override the
;   source_uart.c C6 defaults via -D).  4 MB flash, console = USB-Serial-JTAG.
;   Onboarding = Improv-Serial + captive-AP fallback (no wired uplink).
[env:eul-c3]
extends = env:cdc2net
board    = seeed_xiao_esp32c3
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = partitions_eul_4m.csv
build_flags =
    -D UART_TCM_TX=21
    -D UART_TCM_RX=20
    -D UART_TCM_RST=3
    -D UART_TCM_SET=5
    -D OTA_CHECK_MANIFEST_URL=\"https://install.busware.de/cdc2net/eul/manifest.json\"
    -D OTA_FIRMWARE_URL=\"https://install.busware.de/cdc2net/eul/firmware_esp32c3.bin\"

; TUL — KNX-Stick, ESP32-C3 (seeed XIAO).  Byte-transparent bridge for the
; onboard ON-Semi NCN5130 KNX-TP transceiver on UART1 (RX=20, TX=21, per
; ip4knx tul_esp32c3).  Same C3 UART source + 4 MB layout as env:eul-c3; only
; the module profile + pins differ.  The NCN's RX/TX are galvanically isolated
; (ISO7221) → NO reset/mode GPIO crosses the barrier (RST/SET = -1); the NCN
; operates WITHOUT host register init (no ACR0/V20V write — ESP is USB-powered,
; not bus-powered → no NCN power risk); FHEM/knxd drive TP-UART end-to-end.
; Default line coding 38400 8E1 (via -D UART_MODULE_NCN5130); per-port
; overridable through the WebUI /api/serial NVS default + RFC2217.
[env:tul-c3]
extends = env:cdc2net
board    = seeed_xiao_esp32c3
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = partitions_eul_4m.csv
build_flags =
    -D UART_MODULE_NCN5130
    -D UART_TCM_TX=21
    -D UART_TCM_RX=20
    -D UART_TCM_RST=-1
    -D UART_TCM_SET=-1
    -D OTA_CHECK_MANIFEST_URL=\"https://install.busware.de/cdc2net/tul/manifest.json\"
    -D OTA_FIRMWARE_URL=\"https://install.busware.de/cdc2net/tul/firmware_esp32c3.bin\"

; TUL32 — KNX-Stick, ESP32-C6 (busware TUL32, 4 MB).  Same NCN5130 byte-
; transparent bridge as tul-c3 but on the C6 generation.  UART1 TX=4 RX=5
; (source_uart.c C6 defaults = ip4knx tul32_esp32c6); NCN RX/TX galvanically
; isolated → no reset/mode GPIO (RST/SET=-1).  38400 8E1 default.  W5500 FPC
; add-on possible later (sibling of eul-c6).
[env:tul-c6]
extends = env:cdc2net
board    = esp32-c6-devkitc-1
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = partitions_eul_4m.csv
build_flags =
    -D UART_MODULE_NCN5130
    -D UART_TCM_RST=-1
    -D UART_TCM_SET=-1
    -D OTA_CHECK_MANIFEST_URL=\"https://install.busware.de/cdc2net/tul/manifest.json\"
    -D OTA_FIRMWARE_URL=\"https://install.busware.de/cdc2net/tul/firmware_esp32c6.bin\"

; ======================================================================
; zbgw-s3 — ESP Thread-BR / Zigbee-GW board (Espressif), Zigbee mission.
;   radio  = ESP32-H2 running the full ZBOSS NCP (busware esp-coordinator),
;            NOT an ot_rcp — the S3 never speaks Spinel, it only moves bytes.
;   source = that H2 over the board's inter-chip UART (byte-transparent)
;   net    = W5500 on the official ethernet sub-board (+ WiFi as usual)
; Board wiring, verified against schematics v1.3 / sub v1.0 (2026-07-29):
;   H2 GPIO24 (U0TXD) -> S3 GPIO17 | H2 GPIO23 (U0RXD) <- S3 GPIO18
;   H2 EN <- S3 GPIO7 (reset)      | H2 GPIO9 <- S3 GPIO8 (boot strap)
;   W5500: SCLK 21 · MOSI 45 · MISO 38 · CS 41 · INT 39 · RST 40
; RST/SET stay -1 for now: on this board S3_GPIO8 drives the H2's *boot*
; strap, where the EUL "SET low" semantics would mean download mode, not
; operational baud.  Driving reset/boot is what a later H2-flash-from-S3
; feature needs (esp_rcp_update does exactly that) — not the byte bridge.
; NCP baud must match CONFIG_NCP_UART_BAUD in the H2 firmware (115200).
; ======================================================================
[env:zbgw-s3]
extends = env:cdc2net
board_build.flash_size  = 8MB
board_upload.flash_size = 8MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.zbgw"
; Per-mission OTA channel (subdir MUST match release.sh's MISSION=zbgw).
; Without these the env inherits the FLAT cdc2net URLs from ota_check.h — and
; since every variant shares project(cdc2net), the pull path's project_name
; guard would NOT stop a plain cdc2net S3 image from installing over the
; gateway build (losing the ZB_NCP profile, W5500 pins and radio_flash).
; The chip_id guard doesn't help either (same S3). The feed URL is the
; product identity; release.sh asserts both URLs in the built image.
build_flags =
    -D OTA_CHECK_MANIFEST_URL=\"https://install.busware.de/cdc2net/zbgw/manifest.json\"
    -D OTA_FIRMWARE_URL=\"https://install.busware.de/cdc2net/zbgw/firmware_esp32s3.bin\"
    -D UART_MODULE_ZB_NCP
    -D UART_TCM_TX=18
    -D UART_TCM_RX=17
    -D UART_TCM_RST=-1
    -D UART_TCM_SET=-1
    -D UART_TCM_BAUD=115200
    -D W5500_SCLK=21
    -D W5500_MOSI=45
    -D W5500_MISO=38
    -D W5500_CS=41
    -D W5500_INT=39
    -D W5500_RST=40
