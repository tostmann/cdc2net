## IDF Component Manager Manifest File
version: "2.2.0"
description: USB Host driver for CH34x series of chips
# No `targets:` here on purpose (CDC2NET merge): for a LOCAL component a
# targets-mismatch is a hard error, not a silent exclude.  Non-OTG exclusion is
# done by the CMakeLists OTG guard (registers empty).  See docs/merge-targets §3.2.
url: https://github.com/espressif/esp-usb/tree/master/host/class/cdc/usb_host_ch34x_vcp
issues: "https://github.com/espressif/esp-usb/issues"
repository: "https://github.com/espressif/esp-usb.git"
repository_info:
  path: "host/class/cdc/usb_host_ch34x_vcp"
dependencies:
  espressif/usb_host_cdc_acm:
    version: "^2.1.0"
    override_path: "../usb_host_cdc_acm"
    public: true
